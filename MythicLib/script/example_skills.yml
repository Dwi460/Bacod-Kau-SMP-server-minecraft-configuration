# #################################
# Does nothing
# #################################
none:
  public: true
empty_skill:
  public: true
  name: Empty Skill
  parameters:
    timer:
      name: Timer
      item: 0
    delay:
      name: Delay
      item: 0
    mana:
      name: Mana
      item: 0
    stamina:
      name: Stamina
      item: 0
    cooldown:
      name: Cooldown
      item: 0

# #################################
# Some magical staff attack
# #################################

# The script that you cast to peform the staff attack
staff_attack:
  public: true
  mechanics:
  - raytrace{hit_entity=staff_attack_hit_entity;tick=staff_attack_tick;size=1}
  - sound{sound=ENTITY_BLAZE_SHOOT;pitch=1;volume=1}
  name: Staff Attack
  parameters:
    timer:
      name: Timer
      item: 0
    mana:
      name: Mana
      item: 0
    stamina:
      name: Stamina
      item: 0
    cooldown:
      name: Cooldown
      item: 0

# The effect when the attack hits an entity
staff_attack_hit_entity:
  conditions:
  - can_target
  mechanics:
  - damage{amount=10;ignore_immunity=true}
  - particle{particle=LAVA;amount=32}

# The tick effect while the raytrace is ongoing
staff_attack_tick:
  mechanics:
  - particle{particle=REDSTONE;amount=4;x=.5;y=.5;z=.5}
